# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# mlops.yml (the MLOps release gate: evaluation + local vertical slice) stays as it is.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mlops:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12" # the release gate runs on the runner's python3 (3.12 on ubuntu-24.04)
      # Standard-library scripts with no pyproject or requirements: nothing to install.
      install-command: ""
      # Every offline test file (stdlib unittest scripts; no install needed).
      test-command: for t in infra/tests/mlops/*_test.py; do python "$t" || exit 1; done

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

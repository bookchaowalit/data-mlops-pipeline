# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# mlops.yml (the MLOps release gate: evaluation + local vertical slice) stays as it is.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mlops:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.12" # the release gate runs on the runner's python3 (3.12 on ubuntu-24.04)
      # Standard-library scripts with no pyproject or requirements: nothing to install.
      install-command: ""
      test-command: python infra/tests/mlops/mlops_pipeline_test.py

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
